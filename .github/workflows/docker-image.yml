name: Build, Push Multiple Images to Docker Hub & Upload to Google Drive

on:
  workflow_dispatch: # 🎯 允许在 GitHub Actions 页面手动点击运行

jobs:
  # ==================== Job 1: 构建并推送到 Docker Hub ====================
  build-and-push-dockerhub:
    name: 🚀 Build & Push (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: geoglify-webapp
            context: ./webapp
          - name: geoglify-database
            context: ./database

    steps:
      # 1️⃣ 检出仓库代码
      - name: 🐙 Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2️⃣ 清理 Runner 磁盘空间,防止编译多架构镜像时爆掉磁盘
      - name: 🧹 Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # 3️⃣ 配置 QEMU 模拟器(用于编译 arm64 架构)
      - name: 🐢 Setup QEMU
        uses: docker/setup-qemu-action@v3

      # 4️⃣ 初始化 Docker Buildx
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 5️⃣ 登录到 Docker Hub
      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # 💡 需在 GitHub Secrets 配置
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # 💡 需在 GitHub Secrets 配置

      # 6️⃣ 生成 Docker 镜像标签元数据
      - name: 🏷️ Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest
          flavor: |
            latest=auto
            prefix=
            suffix=

      # 7️⃣ 编译多架构镜像并直接推送到 Docker Hub
      - name: 📤 Build and Push Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== Job 2: 打包镜像归档上传至 Google Drive ====================
  backup-to-google-drive:
    name: ☁️ Backup Images to Google Drive
    needs: build-and-push-dockerhub # 💡 确保 Docker Hub 推送成功后再执行备份
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出仓库代码
      - name: 🐙 Checkout Repository
        uses: actions/checkout@v4.2.2

      # 2️⃣ 初始化 Buildx 环境
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # 3️⃣ 安装本地打包与压缩依赖
      - name: 📦 Install Packaging Tools
        run: |
          sudo apt update
          sudo apt install -y gzip xz-utils curl

      # 4️⃣ 安装 rclone 传输工具
      - name: ⚡ Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # 5️⃣ 部署 rclone 授权配置
      - name: ⚙️ Setup rclone Config
        env:
          RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FSXEDX_DRIVE }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_SECRET_DATA" > ~/.config/rclone/rclone.conf

      # 6️⃣ 验证 rclone 连通性
      - name: 🔍 Verify rclone Status
        run: |
          rclone version
          rclone listremotes

      # 7️⃣ 在本地构建镜像副本(构建 Webapp)
      - name: 🏗️ Build Local Webapp Image
        run: |
          docker build -t geoglify-webapp:latest ./webapp

      # 8️⃣ 在本地构建镜像副本(构建 Database)
      - name: 🏗️ Build Local Database Image
        run: |
          docker build -t geoglify-database:latest ./database

      # 9️⃣ 查看本地生成的所有镜像
      - name: 🖼️ Show Local Images
        run: |
          docker images

      # 🔟 把两个本地镜像打入同一个 tar 压缩包
      - name: 💾 Save Docker Images to Single Archive
        run: |
          docker save \
            geoglify-webapp:latest \
            geoglify-database:latest \
            -o all_images.tar

      # 1️⃣1️⃣ 使用 xz 极致高比例压缩
      - name: 🗜️ Compress Archive with xz
        run: |
          xz -T0 -6 all_images.tar

      # 1️⃣2️⃣ 显示压缩包最终体积
      - name: 📏 Show Archive Size
        run: |
          ls -lh all_images.tar.xz

      # 1️⃣3️⃣ 在 Google Drive 中创建备份文件夹
      - name: 📁 Create Google Drive Directory
        run: |
          rclone mkdir Google:/backup || true

      # 1️⃣4️⃣ 复制压缩文件至 Google Drive
      - name: ☁️ Upload Archive to Google Drive
        run: |
          rclone copy \
            all_images.tar.xz \
            Google:/backup/ \
            --progress

      # 1️⃣5️⃣ 校验网盘存储内容
      - name: ✅ Verify Google Drive Upload
        run: |
          echo "🎉 搬运成功!网盘文件清单如下:"
          rclone lsf Google:/backup/
